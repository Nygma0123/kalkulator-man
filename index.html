<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wala Akong Pake Calculator</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#111;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .calculator{
      background:#222;
      padding:20px;
      border-radius:15px;
      width:320px;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    h2{
      text-align:center;
      margin-bottom:15px;
    }

    input{
      width:100%;
      height:50px;
      font-size:20px;
      margin-bottom:15px;
      text-align:right;
      border:none;
      border-radius:10px;
      padding:10px;
    }

    .buttons{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
    }

    button{
      height:60px;
      font-size:20px;
      border:none;
      border-radius:10px;
      background:#333;
      color:white;
      cursor:pointer;
      transition:0.2s;
    }

    button:hover{
      background:#555;
    }

    .equal{
      background:#ff4444;
    }

    .equal:hover{
      background:#ff6666;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <h2>Calculator</h2>

    <input type="text" id="display" readonly>

    <div class="buttons">
      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button onclick="add('/')">÷</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button onclick="add('*')">×</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button onclick="add('-')">−</button>

      <button onclick="add('0')">0</button>
      <button onclick="add('.')">.</button>
      <button onclick="clearDisplay()">C</button>
      <button onclick="add('+')">+</button>

      <button class="equal" onclick="calculate()" style="grid-column: span 4;">
        =
      </button>
    </div>
  </div>

  <script>
    function add(value){
      document.getElementById("display").value += value;
    }

    function clearDisplay(){
      document.getElementById("display").value = "";
    }

    function calculate(){
      let expression = document.getElementById("display").value;

      try{
        eval(expression);

        // Lahat ng sagot ito
        document.getElementById("display").value =
          "wala akong pake sa opinyon mo marvi gamora";
      }
      catch{
        document.getElementById("display").value = "Error";
      }
    }
  </script>

</body>
</html>
